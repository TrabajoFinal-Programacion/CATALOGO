# Configuracion del servicio de catalogo y sincronizacion.
# Todo valor sensible o dependiente del entorno se toma de variables de entorno.

server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: catalogo-service
  datasource:
    url: ${CATALOGO_DB_URL:jdbc:postgresql://localhost:5432/catalogo}
    username: ${CATALOGO_DB_USER:catalogo}
    password: ${CATALOGO_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none # el esquema lo administra Flyway
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: true

  # --- Redis de la catedra (credenciales de "integration") ---
  data:
    redis:
      # Redis se usa solo con StringRedisTemplate: sin repositorios Spring Data Redis.
      repositories:
        enabled: false
      host: ${CATEDRA_REDIS_HOST:localhost}
      port: ${CATEDRA_REDIS_PORT:6379}
      username: ${CATEDRA_REDIS_USERNAME:}
      password: ${CATEDRA_REDIS_PASSWORD:}
      timeout: 3s
      connect-timeout: 3s

  # --- Kafka de la catedra ---
  kafka:
    bootstrap-servers: ${CATEDRA_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # El offset se confirma solo despues de procesar (y persistir) cada mensaje.
      ack-mode: record

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  catedra:
    api-url: ${CATEDRA_API_URL:}
    token: ${CATEDRA_TOKEN:}
    group-id: ${CATEDRA_GROUP_ID:}
    # Por defecto se derivan del groupId, como indica el contrato. Se pueden sobrescribir.
    kafka-catalog-topic: ${CATEDRA_KAFKA_CATALOG_TOPIC:catedra.catalog.${app.catedra.group-id}}
    kafka-consumer-group: ${CATEDRA_KAFKA_CONSUMER_GROUP:alumnos-${app.catedra.group-id}}
    connect-timeout: ${CATEDRA_CONNECT_TIMEOUT:PT3S}
    read-timeout: ${CATEDRA_READ_TIMEOUT:PT20S}
    max-attempts: ${CATEDRA_MAX_ATTEMPTS:3}
    retry-backoff: ${CATEDRA_RETRY_BACKOFF:PT2S}
  sync:
    scheduler-enabled: ${SYNC_SCHEDULER_ENABLED:true}
    initial-delay: ${SYNC_INITIAL_DELAY:PT5S}
    reconcile-interval: ${SYNC_RECONCILE_INTERVAL:PT60S}
    kafka-retry-interval: ${SYNC_KAFKA_RETRY_INTERVAL:PT5S}
    kafka-max-retries: ${SYNC_KAFKA_MAX_RETRIES:3}
    diagnostics-enabled: ${SYNC_DIAGNOSTICS_ENABLED:true}
  security:
    jwt:
      # Catalogo solo valida: tiene la clave publica de turnos, nunca la privada.
      issuer: ${JWT_ISSUER:turnos-service}
      audience: ${JWT_AUDIENCE:turnos-app}
      public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:../turnos-service/deploy/secrets/jwt-public.pem}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}

logging:
  level:
    root: INFO
    ar.edu.um.catalogo: INFO
